# Entorno de desarrollo local. Para un dominio usa deploy/docker-compose.production.yml.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Copia .env.example como .env}
      MYSQL_DATABASE: los_magueyes
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/los_magueyes.sql:/docker-entrypoint-initdb.d/01-los-magueyes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: los_magueyes
      DB_USER: root
      DB_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Copia .env.example como .env}
      SESSION_SECRET: ${DOCKER_SESSION_SECRET:?Copia .env.example como .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@losmagueyes.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
    ports:
      - "3000:3000"

  catalog-service:
    build: .
    restart: unless-stopped
    command: npm run catalog
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CATALOG_PORT: 4001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: los_magueyes
      DB_USER: root
      DB_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Copia .env.example como .env}
    ports:
      - "4001:4001"

volumes:
  mysql_data:
