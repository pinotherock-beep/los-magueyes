[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "ejs", "mysql2", "swagger-ui-dist"]
  included_files = ["views/**", "public/js/swagger-ui.js", "public/css/swagger-docs.css"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
